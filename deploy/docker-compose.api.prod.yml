name: 3dtrees-api

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
      start_interval: 1s
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
      GALAXY_URL: ${GALAXY_URL}
      GALAXY_EMAIL: ${GALAXY_EMAIL}
      GALAXY_PASSWORD: ${GALAXY_PASSWORD}
      GALAXY_API_KEY: ${GALAXY_API_KEY}
      GALAXY_FILE_SOURCE_RAW: ${GALAXY_FILE_SOURCE_RAW}
      GALAXY_FILE_SOURCE_PRODUCTS: ${GALAXY_FILE_SOURCE_PRODUCTS}
      GALAXY_FILE_SOURCE_VISUALIZATION: ${GALAXY_FILE_SOURCE_VISUALIZATION}
      GALAXY_FILE_SOURCE_SCHEME: ${GALAXY_FILE_SOURCE_SCHEME}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_PROCESSOR_USER_ID: ${SUPABASE_PROCESSOR_USER_ID}
      SUPABASE_EMAIL: ${SUPABASE_EMAIL}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      STORAGE_URL: ${STORAGE_URL}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME}
      STORAGE_BUCKET_NAME_PRODUCTS: ${STORAGE_BUCKET_NAME_PRODUCTS}
      STORAGE_BUCKET_NAME_RAW: ${STORAGE_BUCKET_NAME_RAW}
      STORAGE_BUCKET_NAME_VISUALIZATION: ${STORAGE_BUCKET_NAME_VISUALIZATION}
      STORAGE_BUCKET_NAME_DOWNLOAD: ${STORAGE_BUCKET_NAME_DOWNLOAD:-3dtrees-downloads}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_ACCESS_KEY_PROCESSOR: ${STORAGE_ACCESS_KEY_PROCESSOR}
      STORAGE_SECRET_KEY_PROCESSOR: ${STORAGE_SECRET_KEY_PROCESSOR}
      STORAGE_ACCESS_KEY_UPLOADER: ${STORAGE_ACCESS_KEY_UPLOADER}
      STORAGE_SECRET_KEY_UPLOADER: ${STORAGE_SECRET_KEY_UPLOADER}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      API_SERVER_PORT: ${API_SERVER_PORT:-8000}
    command: ["python", "-m", "trees_api.app.server"]
    ports:
      - "127.0.0.1:8000:8000"

  download-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "trees_api.routes.downloads.worker", "--continuous"]
    restart: unless-stopped
    environment:
      DOWNLOAD_WORKER_INTERVAL: ${DOWNLOAD_WORKER_INTERVAL:-15}
      DOWNLOAD_URL_EXPIRES_SECONDS: ${DOWNLOAD_URL_EXPIRES_SECONDS:-604800}
      DOWNLOAD_RETENTION_DAYS: ${DOWNLOAD_RETENTION_DAYS:-7}
      DOWNLOAD_KEY_PREFIX: ${DOWNLOAD_KEY_PREFIX:-downloads}
      BREVO_API_URL: ${BREVO_API_URL}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      BREVO_REPLY_TO_EMAIL: ${BREVO_REPLY_TO_EMAIL}
      BREVO_REPLY_TO_NAME: ${BREVO_REPLY_TO_NAME}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_PROCESSOR_USER_ID: ${SUPABASE_PROCESSOR_USER_ID}
      SUPABASE_EMAIL: ${SUPABASE_EMAIL}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      STORAGE_URL: ${STORAGE_URL}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME}
      STORAGE_BUCKET_NAME_PRODUCTS: ${STORAGE_BUCKET_NAME_PRODUCTS}
      STORAGE_BUCKET_NAME_RAW: ${STORAGE_BUCKET_NAME_RAW}
      STORAGE_BUCKET_NAME_VISUALIZATION: ${STORAGE_BUCKET_NAME_VISUALIZATION}
      STORAGE_BUCKET_NAME_DOWNLOAD: ${STORAGE_BUCKET_NAME_DOWNLOAD:-3dtrees-downloads}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_ACCESS_KEY_PROCESSOR: ${STORAGE_ACCESS_KEY_PROCESSOR}
      STORAGE_SECRET_KEY_PROCESSOR: ${STORAGE_SECRET_KEY_PROCESSOR}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}

  status-pooler:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "trees_api.workers.status_pooler", "--continuous"]
    restart: unless-stopped
    environment:
      STATUS_POOLER_INTERVAL: ${STATUS_POOLER_INTERVAL:-10}
      GALAXY_URL: ${GALAXY_URL}
      GALAXY_EMAIL: ${GALAXY_EMAIL}
      GALAXY_PASSWORD: ${GALAXY_PASSWORD}
      GALAXY_API_KEY: ${GALAXY_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_PROCESSOR_USER_ID: ${SUPABASE_PROCESSOR_USER_ID}
      SUPABASE_EMAIL: ${SUPABASE_EMAIL}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      STORAGE_URL: ${STORAGE_URL}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME}
      STORAGE_BUCKET_NAME_PRODUCTS: ${STORAGE_BUCKET_NAME_PRODUCTS}
      STORAGE_BUCKET_NAME_RAW: ${STORAGE_BUCKET_NAME_RAW}
      STORAGE_BUCKET_NAME_VISUALIZATION: ${STORAGE_BUCKET_NAME_VISUALIZATION}
      STORAGE_BUCKET_NAME_DOWNLOAD: ${STORAGE_BUCKET_NAME_DOWNLOAD:-3dtrees-downloads}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_ACCESS_KEY_PROCESSOR: ${STORAGE_ACCESS_KEY_PROCESSOR}
      STORAGE_SECRET_KEY_PROCESSOR: ${STORAGE_SECRET_KEY_PROCESSOR}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      LINEAR_API_KEY: ${LINEAR_API_KEY}
      LINEAR_ENABLED: ${LINEAR_ENABLED:-false}
